name: Mloflo automation testing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *' # Runs every day at 2 AM UTC

jobs:
  cypress-run:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm ci

      - name: Install Cypress
        run: npx cypress install

      - name: Verify Cypress binary
        run: npx cypress verify

      - name: Run Cypress Tests
        run: |
          npx cypress run --reporter json --reporter-options "output=cypress/results.json"
        continue-on-error: true # ✅ Ensures next steps run even if tests fail

      - name: Debug Test Results
        run: cat cypress/results.json  # Logs Cypress test results

      - name: Upload Cypress Videos (Uncompressed)
        uses: actions/upload-artifact@v4
        with:
          name: cypress-test-videos
          path: cypress/videos
          retention-days: 5

      - name: Ensure Report Directory Exists
        run: mkdir -p cypress/reports/mochawesome
        shell: bash

      - name: Merge Test Reports
        run: |
          if [ -n "$(ls -A cypress/reports/mochawesome/*.json 2>/dev/null)" ]; then
            npx mochawesome-merge cypress/reports/mochawesome/*.json > cypress/reports/mochawesome/merged-report.json
            npx marge cypress/reports/mochawesome/merged-report.json --reportDir cypress/reports/mochawesome --inline true
          else
            echo "❌ No mochawesome reports found!"
            exit 1
          fi
        shell: bash

      - name: Extract Test Summary
        run: |
          if [ -f "cypress/results.json" ]; then
            TOTAL=$(jq '.stats.tests' cypress/results.json)
            PASSED=$(jq '.stats.passes' cypress/results.json)
            FAILED=$(jq '.stats.failures' cypress/results.json)
            SKIPPED=$(jq '.stats.skipped' cypress/results.json)

            echo "TOTAL_TESTS=$TOTAL" >> $GITHUB_ENV
            echo "PASSED_TESTS=$PASSED" >> $GITHUB_ENV
            echo "FAILED_TESTS=$FAILED" >> $GITHUB_ENV
            echo "SKIPPED_TESTS=$SKIPPED" >> $GITHUB_ENV
          else
            echo "❌ Error: cypress/results.json not found!"
            exit 1
          fi
        shell: bash

      # ✅ Send Email for Passed Tests
      - name: Send Email Notification on Success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "✅ Cypress Tests Passed - ${{ github.run_number }}"
          to: "himanshuagamismtp@gmail.com"
          from: "GitHub Actions"
          body: |
            📝 **Cypress Test Summary**
            -------------------------------
            - 🚀 **Total Tests:** ${{ env.TOTAL }}
            - ✅ **Passed:** ${{ env.PASSED }}
            - ❌ **Failed:** ${{ env.FAILED }}
            - ⏭️ **Skipped:** ${{ env.SKIPPED }}

            📌 **Artifacts:**
            - [View HTML Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - [Download Screenshots & Videos](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      # ❌ Send Email for Failed Tests
      - name: Send Email Notification on Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "❌ Cypress Tests Failed - ${{ github.run_number }}"
          to: "himanshuagamismtp@gmail.com"
          from: "GitHub Actions"
          body: |
            📝 **Cypress Test Summary**
            ----------------------------
            - 🚀 **Total Tests:** ${{ env.TOTAL }}
            - ✅ **Passed:** ${{ env.PASSED }}
            - ❌ **Failed:** ${{ env.FAILED }}
            - ⏭️ **Skipped:** ${{ env.SKIPPED }}

            ⚠️ Some tests have failed. Please check the report below.

            📌 **Artifacts:**
            - [View HTML Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - [Download Screenshots & Videos](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          attachments: "cypress/reports/mochawesome/merged-report.html"
