name: Mloflo automation testing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *' # Runs every day at 2 AM UTC

jobs:
  cypress-run:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm ci

      - name: Install Cypress
        run: npx cypress install

      - name: Verify Cypress binary
        run: npx cypress verify

      - name: Run Cypress Tests with Mochawesome
        shell: cmd
        run: |
          npx cypress run --reporter mochawesome --reporter-options "reportDir=cypress/reports/mochawesome,overwrite=false,html=false,json=true"


      - name: Upload Cypress Videos (Uncompressed)
        uses: actions/upload-artifact@v4
        with:
          name: cypress-test-videos
          path: cypress/videos
          retention-days: 5

      - name: Ensure Report Directory Exists
        run: mkdir -p cypress/reports/mochawesome
        shell: bash

      - name: Debug Cypress Results Folder
        run: ls -R cypress/

      - name: Merge Mochawesome Reports and Generate HTML
        run: |
          if [ -n "$(ls -A cypress/reports/mochawesome/*.json 2>/dev/null)" ]; then
            npx mochawesome-merge cypress/reports/mochawesome/*.json > cypress/reports/mochawesome/merged-report.json
            npx marge cypress/reports/mochawesome/merged-report.json --reportDir cypress/reports/mochawesome --inline true
          else
            echo "❌ No mochawesome reports found!"
            exit 1
          fi
        shell: bash

      - name: Install jq (for JSON processing)
        run: |
          choco install jq -y || echo "jq already installed or not needed on Windows"
        shell: powershell

      - name: Extract Test Summary from Merged Report
        run: |
          if [ -f "cypress/reports/mochawesome/merged-report.json" ]; then
            echo "✅ Merged Mochawesome report found."
            cat cypress/reports/mochawesome/merged-report.json
            TOTAL_TESTS=$(jq '.stats.tests' cypress/reports/mochawesome/merged-report.json)
            PASSED_TESTS=$(jq '.stats.passes' cypress/reports/mochawesome/merged-report.json)
            FAILED_TESTS=$(jq '.stats.failures' cypress/reports/mochawesome/merged-report.json)
            SKIPPED_TESTS=$(jq '.stats.skipped' cypress/reports/mochawesome/merged-report.json)

            echo "TOTAL_TESTS=$TOTAL_TESTS" >> $GITHUB_ENV
            echo "PASSED_TESTS=$PASSED_TESTS" >> $GITHUB_ENV
            echo "FAILED_TESTS=$FAILED_TESTS" >> $GITHUB_ENV
            echo "SKIPPED_TESTS=$SKIPPED_TESTS" >> $GITHUB_ENV
          else
            echo "❌ Error: merged-report.json not found!"
            exit 1
          fi
        shell: bash

      - name: Send Email Notification on Success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "✅ Cypress Tests Passed - ${{ github.run_number }}"
          to: "himanshuagamismtp@gmail.com"
          from: "GitHub Actions"
          body: |
            📝 **Cypress Test Summary**
            -------------------------------
            - 🚀 **Total Tests:** ${{ env.TOTAL_TESTS }}
            - ✅ **Passed:** ${{ env.PASSED_TESTS }}
            - ❌ **Failed:** ${{ env.FAILED_TESTS }}
            - ⏭️ **Skipped:** ${{ env.SKIPPED_TESTS }}

            📌 **Artifacts:**
            - [View HTML Report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - [Download Screenshots & Videos](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Send Email Notification on Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "❌ Cypress Tests Failed - ${{ github.run_number }}"
          to: "himanshuagamismtp@gmail.com"
          from: "GitHub Actions"
          body: |
            📝 **Cypress Test Summary**
            ----------------------------
            - 🚀 **Total Tests:** ${{ env.TOTAL_TESTS }}
            - ✅ **Passed:** ${{ env.PASSED_TESTS }}
            - ❌ **Failed:** ${{ env.FAILED_TESTS }}
            - ⏭️ **Skipped:** ${{ env.SKIPPED_TESTS }}

            ⚠️ Some tests have failed. Please check the report below.

            📌 **Artifacts:**
            - [View HTML Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - [Download Screenshots & Videos](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

          attachments: "cypress/reports/mochawesome/merged-report.html"
